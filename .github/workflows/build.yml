# Gera os instaladores do Cena: macOS (.dmg Intel e Apple Silicon) e Linux (.deb e AppImage).
# Rode em Actions → "Gerar instaladores" → Run workflow, ou publicando uma tag v*.
name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  mac:
    needs: testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Montar o app (sem assinatura de desenvolvedor)
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Cena-macOS
          path: release/dmg/*.dmg

  linux:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Cena-Linux
          path: |
            release/*.deb
            release/*.AppImage

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: pacotes, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          body: |
            **macOS:** baixe o .dmg do seu Mac (apple-silicon para M1/M2/M3/M4, intel para os anteriores), arraste o Cena para Aplicativos e, na primeira vez, abra com clique direito → Abrir.
            **Linux:** .deb (Ubuntu, Mint, Debian) ou AppImage (qualquer distribuição).
